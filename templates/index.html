<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#667eea">
    <title>Seasonal Horizon</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='icon.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <main class="container">
        <header>
            <div class="brand">
                <span class="brand-icon">☀️</span>
                <h1>Seasonal Horizon</h1>
            </div>
            <button class="icon-btn" onclick="openSettings()" title="Settings">⚙️</button>
        </header>

        <section class="card">
            <p id="location-label" class="location-label">{{ default_city }}</p>
            <div id="loader" class="loader">
                <div class="spinner"></div>
                <span id="loader-text">Reading the sky...</span>
            </div>
            <div id="content" class="content hidden">
                <p id="uplift-text" class="uplift-text"></p>
                
                <div class="facts-section">
                    <div class="facts-row">
                        <div class="fact">
                            <span class="label">
                                <span class="icon">🌅</span>
                                <span class="text" data-i18n="sunrise">Sunrise</span>
                            </span>
                            <span id="f-sunrise" class="val">--</span>
                        </div>
                        <div class="fact">
                            <span class="label">
                                <span class="icon">🌇</span>
                                <span class="text" data-i18n="sunset">Sunset</span>
                            </span>
                            <span id="f-sunset" class="val">--</span>
                        </div>
                        <div class="fact">
                            <span class="label">
                                <span class="icon">☀️</span>
                                <span class="text" data-i18n="daylight">Daylight</span>
                            </span>
                            <span id="f-length" class="val">--</span>
                        </div>
                    </div>
                </div>

                <div class="facts-section">
                    <div class="facts-row">
                        <div class="fact delta-fact">
                            <span class="label">
                                <span class="text" data-i18n="vsYesterday">vs Yesterday</span>
                            </span>
                            <span id="f-delta-d" class="val">--</span>
                        </div>
                        <div class="fact delta-fact">
                            <span class="label">
                                <span class="text" data-i18n="vsLastWeek">vs Last Week</span>
                            </span>
                            <span id="f-delta-w" class="val">--</span>
                        </div>
                        <div class="fact delta-fact">
                            <span class="label">
                                <span class="text" data-i18n="vsSolstice">vs Solstice</span>
                            </span>
                            <span id="f-delta-s" class="val">--</span>
                        </div>
                    </div>
                </div>

                <div class="facts-section weather-section">
                    <div class="weather-display">
                        <div class="weather-main">
                            <span id="weather-icon" class="weather-icon">☀️</span>
                            <span id="f-weather" class="weather-desc">Clear</span>
                        </div>
                        <div class="weather-temp-box">
                            <span id="f-temp" class="weather-temp">--</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        
        <footer class="footer">
            <p id="footer-text">Your daily reminder that light always returns.</p>
        </footer>
    </main>

    <div id="app-config" hidden
         data-city="{{ default_city }}"
         data-lat="{{ default_lat }}"
         data-lon="{{ default_lon }}"></div>

    <div id="overlay" class="overlay hidden" onclick="handleOverlayClick(event)">
        <div class="overlay-box">
            <div class="overlay-header">
                <h2 data-i18n="settings">Settings</h2>
                <button class="close-btn" onclick="closeSettings()" title="Close">&times;</button>
            </div>
            
            <div class="settings-section">
                <h3 data-i18n="language">Language</h3>
                <select id="lang-select" onchange="changeLanguage(this.value)">
                    <option value="en">English</option>
                    <option value="de">Deutsch</option>
                </select>
            </div>
            
            <div class="settings-section">
                <h3 data-i18n="location">Location</h3>
                <label data-i18n="searchCity">Search for a city</label>
                <input type="text" id="city-input" placeholder="e.g. Berlin, Tokyo, New York..." autocomplete="off">
                <ul id="city-results" class="results-list"></ul>
                <div class="current-location" id="current-loc"></div>
            </div>
            
            <div class="version-section">
                <span class="version-label" onclick="toggleChangelog()">{{ version }}</span>
                <div id="changelog" class="changelog hidden">
                    <ul id="changelog-list">
                        <!-- Filled by JS -->
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
