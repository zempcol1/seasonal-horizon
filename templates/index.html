<!DOCTYPE html>
<html lang="en" data-phase="{{ phase }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#2c3e66">
    <title>Seasonal Horizon</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='icon.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <main class="container">
        <header>
            <div class="brand">
                <span class="brand-icon" aria-hidden="true"></span>
                <h1>Seasonal Horizon</h1>
            </div>
            <button class="icon-btn" onclick="openSettings()" data-i18n-label="settings" aria-label="Settings">⚙️</button>
        </header>

        <section class="card">
            <div class="card-meta">
                <p id="location-label" class="location-label">{{ default_city }}</p>
                <p id="date-label" class="date-label"></p>
            </div>
            <div id="loader" class="loader">
                <div class="spinner"></div>
                <span id="loader-text">Reading the sky...</span>
            </div>
            <div id="content" class="content hidden">
                <div id="message" class="message" aria-live="polite">
                    <p id="lead" class="uplift-text"></p>
                    <p id="companion" class="companion"></p>
                </div>
                <button id="another-btn" class="another-btn" onclick="anotherMessage()">↻ <span data-i18n="another">Another thought</span></button>

                <div class="facts-section">
                    <div class="facts-row">
                        <div class="fact">
                            <span class="label">
                                <span class="icon">🌅</span>
                                <span class="text" data-i18n="sunrise">Sunrise</span>
                            </span>
                            <span id="f-sunrise" class="val">--</span>
                        </div>
                        <div class="fact">
                            <span class="label">
                                <span class="icon">🌇</span>
                                <span class="text" data-i18n="sunset">Sunset</span>
                            </span>
                            <span id="f-sunset" class="val">--</span>
                        </div>
                        <div class="fact">
                            <span class="label">
                                <span class="icon">☀️</span>
                                <span class="text" data-i18n="daylight">Daylight</span>
                            </span>
                            <span id="f-length" class="val">--</span>
                        </div>
                    </div>
                </div>

                <div id="gains-section" class="facts-section hidden">
                    <div class="facts-row">
                        <div class="fact delta-fact">
                            <span class="label">
                                <span class="text" data-i18n="sinceYesterday">Since yesterday</span>
                            </span>
                            <span id="f-delta-d" class="val">--</span>
                        </div>
                        <div class="fact delta-fact">
                            <span class="label">
                                <span class="text" data-i18n="sinceLastWeek">Since last week</span>
                            </span>
                            <span id="f-delta-w" class="val">--</span>
                        </div>
                        <div class="fact delta-fact">
                            <span class="label">
                                <span class="text" data-i18n="sinceSolstice">Since solstice</span>
                            </span>
                            <span id="f-delta-s" class="val">--</span>
                        </div>
                    </div>
                </div>

                <div class="facts-section weather-section">
                    <div class="weather-display">
                        <div class="weather-main">
                            <span id="weather-icon" class="weather-icon"></span>
                            <span id="f-weather" class="weather-desc">--</span>
                        </div>
                        <div class="weather-temp-box">
                            <span id="f-temp" class="weather-temp">--</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <footer class="footer">
            <p id="footer-text"></p>
        </footer>
    </main>

    <div id="app-config" hidden
         data-city="{{ default_city }}"
         data-lat="{{ default_lat }}"
         data-lon="{{ default_lon }}"></div>

    <div id="overlay" class="overlay hidden" onclick="handleOverlayClick(event)">
        <div class="overlay-box" role="dialog" aria-modal="true" aria-labelledby="settings-title">
            <div class="overlay-header">
                <h2 id="settings-title" data-i18n="settings">Settings</h2>
                <button class="close-btn" onclick="closeSettings()" data-i18n-label="close" aria-label="Close">&times;</button>
            </div>

            <div class="settings-section">
                <h3 id="lang-title" data-i18n="language">Language</h3>
                <select id="lang-select" onchange="changeLanguage(this.value)" aria-labelledby="lang-title">
                    <option value="en">English</option>
                    <option value="de">Deutsch</option>
                </select>
            </div>

            <div class="settings-section">
                <h3 data-i18n="location">Location</h3>
                <label for="city-input" data-i18n="searchCity">Search for a city</label>
                <input type="text" id="city-input" autocomplete="off">
                <ul id="city-results" class="results-list"></ul>
                <div class="current-location" id="current-loc"></div>
            </div>

            <div class="version-section">
                <button class="version-label" onclick="toggleChangelog()">{{ version }}</button>
                <div id="changelog" class="changelog hidden">
                    <ul id="changelog-list"></ul>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
